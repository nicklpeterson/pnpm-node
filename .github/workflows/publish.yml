name: Publish

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - Dockerfile
      - versions.yml
      - package.json
      - pnpm-lock.yaml
      - scripts/**
      - .github/workflows/publish.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: pnpm-node

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - id: matrix
        run: echo "matrix=$(pnpm --silent matrix)" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      PNPM_VERSION: ${{ matrix.pnpm }}
      VARIANT: ${{ matrix.variant }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build and publish
        run: pnpm publish