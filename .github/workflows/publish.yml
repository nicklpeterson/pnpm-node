name: Publish

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild every image, even when the tag already exists
        type: boolean
        default: false

      node_majors:
        description: Build these Node.js majors only, comma separated. Empty builds every major.
        type: string
        default: ""

  push:
    branches:
      - main
    paths:
      - Dockerfile
      - versions.yml
      - package.json
      - pnpm-lock.yaml
      - scripts/**
      - .github/workflows/publish.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: pnpm-node
  FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
  NODE_MAJORS: ${{ inputs.node_majors || '' }}

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true

      - id: matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          matrix="$(pnpm --silent matrix)"

          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<< "${matrix}")" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    env:
      PNPM_VERSION: ${{ matrix.pnpm }}
      VARIANT: ${{ matrix.variant }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v3
        with:
          runtime: node@26
          cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: pnpm run publish:images
